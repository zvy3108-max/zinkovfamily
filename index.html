<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Созвездие семьи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05040e;
  --ink:#e8e6fb;
  --muted:#9b95c6;
  --dim:#6d669e;
  --star:#cfd6ff;
  --blue:#6d8bff;
  --violet:#a97cff;
  --glow:rgba(140,140,255,.6);
  --line:rgba(150,140,255,.5);
  --panel:rgba(20,18,38,.88);
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* далёкий космос — фиксированный слой глубины */
#deep{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1000px 760px at 20% 16%, rgba(88,80,220,.22), transparent 64%),
    radial-gradient(1200px 860px at 84% 84%, rgba(150,86,220,.18), transparent 62%),
    radial-gradient(760px 560px at 62% 42%, rgba(60,96,220,.13), transparent 66%),
    radial-gradient(600px 600px at 8% 88%, rgba(120,70,200,.12), transparent 70%),
    var(--bg);
}
#deep canvas{position:absolute;inset:0;width:100%;height:100%}

/* ---------- ИНТРО ---------- */
#intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:background 1s ease}
#intro.lift{background:transparent;pointer-events:none}
#logo{text-align:center;transform-origin:50% 50%;
  transition:transform 1.6s cubic-bezier(.2,.9,.15,1), opacity 1.6s cubic-bezier(.2,.9,.15,1), filter 1.6s ease}
#logo .mark{width:clamp(40px,7vw,64px);height:clamp(40px,7vw,64px);margin:0 auto 26px;opacity:0;
  animation:sparkIn 1.4s .1s cubic-bezier(.2,.9,.15,1) forwards}
@keyframes sparkIn{from{opacity:0;transform:scale(.4) rotate(-25deg)}to{opacity:1;transform:none}}
#logo .fam{
  font-family:var(--serif);font-weight:300;letter-spacing:.3em;
  font-size:clamp(34px,8.4vw,96px);line-height:1;text-transform:uppercase;
  background:linear-gradient(180deg,#ffffff 0%,#c3c8ff 38%,#9b7dff 72%,#5b5aa8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-indent:.3em;
}
#logo .rule{height:1px;margin:24px auto 18px;width:min(440px,72vw);
  background:linear-gradient(90deg,transparent,rgba(200,214,240,.05) 15%,rgba(220,230,248,.75) 50%,rgba(200,214,240,.05) 85%,transparent);
  transform:scaleX(0);animation:ruleIn 1.3s .4s cubic-bezier(.2,.9,.15,1) forwards}
@keyframes ruleIn{to{transform:scaleX(1)}}
#logo .sub{font-size:clamp(9px,1.4vw,13px);letter-spacing:.5em;text-transform:uppercase;color:var(--dim);
  opacity:0;animation:fadeUp 1.2s .8s ease forwards;text-indent:.5em}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#logo.lift{transform:translateY(-47vh) scale(.2);opacity:.22;filter:blur(.4px)}

#brandmark{position:fixed;top:20px;left:24px;z-index:30;opacity:0;transform:translateY(-8px);
  transition:opacity .9s .6s ease,transform .9s .6s ease;pointer-events:none;display:flex;gap:11px;align-items:center}
#brandmark.show{opacity:.8;transform:none}
#brandmark svg{width:20px;height:20px;flex:0 0 auto}
#brandmark b{font-family:var(--serif);font-weight:400;letter-spacing:.22em;font-size:14px;display:block;color:#dbe3f2}
#brandmark span{font-size:8px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase}

/* ---------- КАРТА-СОЗВЕЗДИЕ ---------- */
#viewport{position:fixed;inset:0;z-index:1;overflow:hidden;cursor:grab;opacity:0;
  transition:opacity 1.1s ease, filter .7s cubic-bezier(.2,.9,.15,1);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  touch-action:none}   /* без этого мобильный браузер сам скроллит и зумит страницу */
#viewport *{user-select:none;-webkit-user-select:none}
#viewport img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
#viewport.ready{opacity:1}
#viewport.grabbing{cursor:grabbing}
/* «немного отдалиться и немного размыться» — заметно, но мягко */
#viewport.dimmed{filter:blur(3.5px) brightness(.62) saturate(.85)}
#world{position:absolute;left:50%;top:50%;transform-origin:0 0;
  transform:translate3d(0,0,0);
  will-change:transform;
  contain:layout style;}   /* слой на GPU: панорама не перерисовывает тысячи пикселей каждый кадр */
#sky,#links{position:absolute;overflow:visible;pointer-events:none}
#links path{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;vector-effect:non-scaling-stroke}
#links path.glow{stroke:rgba(130,110,255,.14);stroke-width:5;stroke-dasharray:none}
#links path.bond{stroke:rgba(196,180,255,.92);stroke-width:1.6;stroke-dasharray:2 5}
#links path.desc{stroke:rgba(140,158,255,.72);stroke-width:1.5;stroke-dasharray:3 6}
#links path.petlink{stroke:rgba(232,203,112,.88);stroke-width:1.35;stroke-dasharray:1 5}
#links path.dim{opacity:.15}

.node{
  position:absolute;width:138px;padding:0;text-align:center;cursor:pointer;
  transform:translate(-50%,-50%);
  transition:opacity .4s ease;
}
.node .halo{
  position:absolute;left:50%;top:12px;width:120px;height:120px;transform:translateX(-50%);
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(140,130,255,.26) 0%,rgba(120,90,220,.10) 45%,transparent 70%);
  opacity:.65;transition:opacity .45s ease,transform .45s ease
}
.node .ph{
  position:relative;width:92px;height:92px;margin:26px auto 0;border-radius:50%;overflow:hidden;
  border:1px solid rgba(168,158,255,.42);background:#12102a;
  box-shadow:0 0 0 5px rgba(8,7,20,.78), 0 8px 28px rgba(0,0,0,.55);
  transition:border-color .4s ease, box-shadow .4s ease, transform .45s cubic-bezier(.2,.9,.15,1)
}
.node .ph img{width:100%;height:100%;object-fit:cover;display:block}
.node .nm{font-family:var(--serif);font-size:15.5px;line-height:1.14;margin-top:12px;color:#e5e1ff;
  text-shadow:0 2px 12px rgba(0,0,0,.8)}
.node .yr{font-size:9.5px;letter-spacing:.16em;color:var(--dim);margin-top:5px}
.node .pet{margin-top:4px;font-size:10px;color:#d8c98a;letter-spacing:.03em;
  text-shadow:0 1px 8px rgba(0,0,0,.8);white-space:nowrap}
.node .mic{position:absolute;top:22px;right:14px;width:17px;height:17px;border-radius:50%;
  background:rgba(220,230,248,.9);color:#0b0d13;font-size:8.5px;display:grid;place-items:center}
.node:hover .halo{opacity:1;transform:translateX(-50%) scale(1.14)}
.node:hover .ph{border-color:rgba(186,168,255,.95);transform:translateY(-3px);
  box-shadow:0 0 0 5px rgba(8,7,20,.78),0 0 30px rgba(140,130,255,.45),0 14px 34px rgba(0,0,0,.6)}
.node.hidden{opacity:.16;pointer-events:none}
.node.focus .ph{border-color:#fff}
.petnode{position:absolute;width:88px;text-align:center;cursor:pointer;transform:translate(-50%,-50%);z-index:2}
.petnode .petph{width:54px;height:54px;margin:0 auto;border-radius:50%;overflow:hidden;background:#201c2f;
  border:1px solid rgba(232,203,112,.8);box-shadow:0 0 0 4px rgba(12,10,24,.8),0 5px 18px rgba(0,0,0,.5)}
.petnode .petph img{width:100%;height:100%;object-fit:cover;display:block}
.petnode .petnm{margin-top:7px;font-family:var(--serif);font-size:13px;line-height:1.05;color:#f0df9c;
  text-shadow:0 2px 9px rgba(0,0,0,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.petnode .petspecies{margin-top:3px;font-size:8px;letter-spacing:.1em;color:#a99b62;text-transform:uppercase}
.petnode:hover .petph,.petnode.focus .petph{border-color:#fff;box-shadow:0 0 0 4px rgba(12,10,24,.8),0 0 20px rgba(232,203,112,.45)}
/* точка-звезда в центре узла (маркер созвездия) */
.node::before{
  content:"";position:absolute;left:50%;top:58px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;
  background:#fff;box-shadow:0 0 8px 2px var(--glow);opacity:0
}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:31;transition:opacity .5s ease}
.hud.hide{opacity:0;pointer-events:none}
#zoomui{right:22px;bottom:22px;display:flex;flex-direction:column;gap:7px}
#zoomui button,#legend{background:var(--panel);border:1px solid rgba(160,150,255,.22);color:var(--ink);
  border-radius:11px}
#zoomui button{width:38px;height:38px;font-size:16px;cursor:pointer;transition:.2s;font-family:var(--sans)}
#zoomui button:hover{border-color:rgba(169,124,255,.75);background:rgba(38,32,68,.9)}
#legend{left:50%;transform:translateX(-50%);bottom:22px;padding:9px 18px;font-size:10.5px;
  letter-spacing:.07em;color:var(--dim);display:flex;gap:15px;white-space:nowrap}
#legend b{color:#c3ccdd;font-weight:400}
@media(max-width:640px){#legend{font-size:9px;gap:9px;padding:7px 11px}}

/* стили карточки (#overlay, #sheet, галерея) — в style.css */

.body{padding:20px 26px 24px;user-select:text;-webkit-user-select:text;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(200,214,242,.3) transparent}
.body::-webkit-scrollbar{width:6px}
.body::-webkit-scrollbar-thumb{background:rgba(200,214,242,.25);border-radius:4px}
.kicker{font-size:9px;letter-spacing:.36em;text-transform:uppercase;color:#a798e8;margin-bottom:11px}
.fio{font-family:var(--serif);font-size:clamp(25px,3.5vw,38px);line-height:1.07;font-weight:400;color:#f0f4fc}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.meta span{display:flex;align-items:center;gap:7px}
.meta span::before{content:"";width:3px;height:3px;border-radius:50%;background:#b3a8ff;box-shadow:0 0 6px var(--glow)}
hr.sep{border:0;height:1px;background:linear-gradient(90deg,rgba(200,214,242,.3),transparent);margin:16px 0}
.bio p{font-size:14px;line-height:1.75;color:#c6cddd;margin:0 0 11px;font-weight:300}
.h6{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);margin:18px 0 10px}
.ownerlink{background:none;border:0;padding:0;margin:0;font:inherit;letter-spacing:inherit;color:#cbc4f2;
  cursor:pointer;text-decoration:underline;text-decoration-color:rgba(160,150,255,.45);text-underline-offset:3px;transition:color .2s}
.ownerlink:hover{color:#fff;text-decoration-color:#fff}

/* стили голоса, компаса направлений и полноэкранного фото — в style.css */
</style>

<!-- данные семьи вынесены в отдельный файл: его удобно править руками -->
<script src="data.js"></script>

<script>
/* =====================================================================
   РЕЖИМ РЕДАКТИРОВАНИЯ  ←←← ГЛАВНЫЙ ПЕРЕКЛЮЧАТЕЛЬ
   EDITOR = 1  → на сайте работает редактор: панель справа, перетаскивание
                 звёзд, добавление/удаление людей, фото, голосов и связей.
   EDITOR = 0  → редактор полностью выключен, обычный сайт для гостей.
   ===================================================================== */
const EDITOR = 0;
/* телефон/планшет: меньше звёзд, проще эффекты */
const MOBILE = matchMedia('(max-width:820px)').matches || matchMedia('(pointer:coarse)').matches;
const STORE_KEY = 'zinkovy.tree.v1';    // ключ автосохранения в браузере

/* PEOPLE, UNIONS, BRANCHES, SITE приходят из data.js (соседний файл) */
if(typeof PEOPLE==='undefined'){window.PEOPLE=[];console.error('Не найден data.js');}
if(typeof UNIONS==='undefined'){window.UNIONS=[];}
if(typeof BRANCHES==='undefined'){window.BRANCHES=[];}
if(typeof PETS==='undefined'){window.PETS=[];}
if(typeof SITE==='undefined'){window.SITE={surname:'Семья',subtitle:'Созвездие семьи',logo:'',mediaBase:'pic/'};}

/* ---------- заголовок и лого ---------- */
function applySite(){
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
  set('famname',SITE.surname||''); set('bmname',SITE.surname||'');
  set('famsub',SITE.subtitle||''); set('bmsub',SITE.subtitle||'');
  document.title=(SITE.surname?SITE.surname+' — ':'')+(SITE.subtitle||'Созвездие семьи');
  [['logomark',''],['bmmark','']].forEach(([id])=>{
    const box=document.getElementById(id); if(!box)return;
    const svg=box.querySelector('svg'), img=box.querySelector('img');
    if(SITE.logo){
      if(svg) svg.style.display='none';
      if(img) img.src=SITE.logo;
      else{const n=document.createElement('img');n.alt='';n.src=SITE.logo;
           n.onerror=()=>{n.remove();if(svg)svg.style.display='';};box.appendChild(n);}
    }else{
      if(img) img.remove();
      if(svg) svg.style.display='';
    }
  });
}

/* ---------- заглушки портретов: серебристо-звёздные ---------- */
function placeholder(name,i){
  const ini=name.split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('');
  const tone=[['#b9c0f0','#3c3a70'],['#c3b4f2','#413066'],['#a9bdf2','#2f3a6b'],['#cabbf5','#4a3a78']][i%4];
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900">
   <defs><linearGradient id="g" x1="0" y1="0" x2=".3" y2="1">
     <stop offset="0" stop-color="${tone[0]}"/><stop offset="1" stop-color="${tone[1]}"/></linearGradient>
    <radialGradient id="v" cx="50%" cy="40%" r="72%">
     <stop offset="52%" stop-color="rgba(0,0,0,0)"/><stop offset="100%" stop-color="rgba(8,10,16,.6)"/></radialGradient></defs>
   <rect width="900" height="900" fill="url(#g)"/>
   <circle cx="450" cy="355" r="148" fill="rgba(20,24,34,.28)"/>
   <path d="M175 900c0-188 124-298 275-298s275 110 275 298z" fill="rgba(20,24,34,.28)"/>
   <g fill="rgba(255,255,255,.5)">
    <circle cx="150" cy="140" r="3"/><circle cx="742" cy="196" r="2.4"/><circle cx="680" cy="92" r="1.8"/>
    <circle cx="240" cy="300" r="1.6"/><circle cx="800" cy="420" r="2"/></g>
   <rect width="900" height="900" fill="url(#v)"/>
   <text x="450" y="836" font-family="Georgia,serif" font-size="66" fill="rgba(15,18,26,.4)"
     text-anchor="middle" letter-spacing="16">${ini}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

/* исходные данные запоминаем до построения модели — для кнопки «Сброс» */
const DEFAULT_DATA=JSON.parse(JSON.stringify({people:PEOPLE,unions:UNIONS,branches:BRANCHES,pets:PETS,site:SITE}));

/* ---------- хранение: правки из редактора живут в браузере ---------- */
function exportData(){
  return {
    people:PEOPLE.map(p=>({
      id:p.id, name:p.name, years:p.years||'',
      x:Math.round(p.x), y:Math.round(p.y),
      place:p.place||'', role:p.role||'', pet:p.pet||'',
      bio:(p.bio||[]).slice(),
      branch:p.branch||'', card:p.card!==false,
      photos:p.autoPhotos?[]:(p.photos||[]).slice(),   // сгенерированные заглушки не сохраняем
      photoTags:p.autoPhotos?[]:(p.photoTags||[]).slice(),
      voices:(p.voices||[]).map(v=>({title:v.title||'',url:v.url||'',dur:v.dur||''}))
    })),
    unions:UNIONS.map(u=>({a:u.a,b:u.b||null,children:(u.children||[]).slice()})),
    branches:BRANCHES.map(b=>({id:b.id,title:b.title,color:b.color})),
    pets:PETS.map(p=>({id:p.id,name:p.name||'',species:p.species||'',owner:p.owner||'',x:Math.round(p.x),y:Math.round(p.y),manualPos:p.manualPos||false,bio:(p.bio||[]).slice(),photos:(p.photos||[]).slice(),photoTags:(p.photoTags||[]).slice()})),
    site:{surname:SITE.surname||'',subtitle:SITE.subtitle||'',logo:SITE.logo||'',mediaBase:SITE.mediaBase||''}
  };
}
function loadData(d){
  const src=d||DEFAULT_DATA;
  PEOPLE=JSON.parse(JSON.stringify(src.people||[]));
  UNIONS=JSON.parse(JSON.stringify(src.unions||[]));
  if(src.branches) BRANCHES=JSON.parse(JSON.stringify(src.branches));
  PETS=JSON.parse(JSON.stringify(src.pets||[]));
  if(src.site) SITE=Object.assign({},SITE,src.site);
  applySite();
}
/* Резервная копия в браузере — только как страховка. Тяжёлые встроенные
   файлы (data:...) в неё не пишутся, иначе память браузера мгновенно
   переполняется. Основное хранение — прямая запись в data.js. */
let backupOff=false;
function persist(){
  if(backupOff)return false;
  try{
    const d=exportData(), light=s=>(typeof s==='string'&&s.startsWith('data:'))?'':s;
    d.people.forEach(p=>{
      const kept=(p.photos||[]).map((src,i)=>({src:light(src),tag:(p.photoTags||[])[i]||''})).filter(x=>x.src);

      p.voices=(p.voices||[]).map(v=>Object.assign({},v,{url:light(v.url)}));
    });
    (d.pets||[]).forEach(p=>{
      const kept=(p.photos||[]).map((src,i)=>({src:light(src),tag:(p.photoTags||[])[i]||''})).filter(x=>x.src);

    backupOff=true;                       // больше не пытаемся и не мозолим глаза
    try{localStorage.removeItem(STORE_KEY);}catch(_){}
    return false;
  }
}
(function restore(){

/* ---------- модель + родственные связи ---------- */
const byId={},petById={};
const female=n=>/[ая]$/.test(String(n||'').split(' ')[0]);
const uniq=a=>[...new Set(a)];
function buildModel(){
  Object.keys(byId).forEach(k=>delete byId[k]);
  Object.keys(petById).forEach(k=>delete petById[k]);
  PEOPLE.forEach(p=>{
    if(!Array.isArray(p.bio))    p.bio=p.bio?[String(p.bio)]:[];
    if(!Array.isArray(p.voices)) p.voices=[];
    if(!Array.isArray(p.photoTags)) p.photoTags=[];
    if(p.card===undefined)       p.card=true;          // false → звезда без карточки
    if(p.branch===undefined)     p.branch='';
    if(p.pet===undefined)        p.pet='';             // питомец, показывается рядом с хозяином
    if(!Array.isArray(p.photos)||!p.photos.length){
      p.photos=[0,1,2,3].map(i=>placeholder(p.name,i)); p.autoPhotos=true;
    }else p.autoPhotos=false;
    p.photoTags=p.photoTags.slice(0,p.photos.length);
    while(p.photoTags.length<p.photos.length)p.photoTags.push('');
    p.rel={parents:[],children:[],spouse:[],sibs:[]};
    byId[p.id]=p;
  });
  /* Подхватываем старое текстовое поле «питомец» как полноценного питомца. */
  PEOPLE.forEach(p=>{
    if(p.pet&&!PETS.some(x=>x.owner===p.id&&x.name===p.pet)){
      let n=1; while(PETS.some(x=>x.id==='legacy-pet'+n))n++;
      PETS.push({id:'legacy-pet'+n,name:p.pet,species:'',owner:p.id,bio:[],photos:[],photoTags:[]});
    }
  });
PETS.forEach((p,i)=>{
    if(!p.id){p.id='pet'+(i+1);}
    if(!p.name)p.name='Питомец';
    if(!p.species)p.species='';
    if(!p.owner)p.owner='';
    if(p.manualPos===undefined) p.manualPos=false;
    if(p.x===undefined)p.x=NaN;if(p.y===undefined)p.y=NaN;
    if(!Array.isArray(p.bio))p.bio=p.bio?[String(p.bio)]:[];
    if(!Array.isArray(p.photoTags))p.photoTags=[];
    if(!Array.isArray(p.photos)||!p.photos.length){
      p.photos=[petPlaceholder(p.name)]; p.autoPhotos=true;
    }else p.autoPhotos=false;
    p.photoTags=p.photoTags.slice(0,p.photos.length);
    while(p.photoTags.length<p.photos.length)p.photoTags.push('');
    petById[p.id]=p;
  });
  UNIONS.forEach(u=>{
    if(!Array.isArray(u.children)) u.children=[];
    const A=byId[u.a], Bx=byId[u.b];                 // b может отсутствовать — одинокий родитель
    if(A&&Bx){A.rel.spouse.push(Bx.id);Bx.rel.spouse.push(A.id);}
    u.children.forEach(c=>{
      const C=byId[c]; if(!C)return;
      [A,Bx].forEach(P=>{if(P){P.rel.children.push(c);C.rel.parents.push(P.id);}});
    });
    u.children.forEach(c=>u.children.forEach(d=>{if(c!==d&&byId[c])byId[c].rel.sibs.push(d)}));
  });
  PEOPLE.forEach(p=>['parents','children','spouse','sibs'].forEach(k=>p.rel[k]=uniq(p.rel[k])));
  positionPets();
}
function petPlaceholder(name){
  const safe=String(name||'Питомец').replace(/[&<>"']/g,'');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
    <defs><radialGradient id="g"><stop stop-color="#e8d78d"/><stop offset="1" stop-color="#5d4a2a"/></radialGradient></defs>
    <rect width="600" height="600" rx="300" fill="#18152c"/><circle cx="300" cy="300" r="190" fill="url(#g)" opacity=".75"/>
    <g fill="#171329"><circle cx="300" cy="335" r="65"/><circle cx="215" cy="245" r="45"/><circle cx="385" cy="245" r="45"/>
    <circle cx="260" cy="320" r="12" fill="#f7f0c5"/><circle cx="340" cy="320" r="12" fill="#f7f0c5"/></g>
    <text x="300" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="34" fill="#fff" opacity=".75">${safe}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function petsOf(id){return PETS.filter(p=>p.owner===id);}
function positionPets(){
  const seen={};
  PETS.forEach(p=>{
    const owner=byId[p.owner];
    if(!owner){p.x=NaN;p.y=NaN;return;}
    const i=seen[p.owner]||0, total=petsOf(p.owner).length; seen[p.owner]=i+1;
    if(p.manualPos) return;
    p.x=owner.x+145; p.y=owner.y+(i-(total-1)/2)*72;
  });
}
function relLabel(from,to){
  const t=byId[to];
  if(from.rel.parents.includes(to)) return female(t.name)?'Мать':'Отец';
  if(from.rel.children.includes(to)) return female(t.name)?'Дочь':'Сын';
  if(from.rel.spouse.includes(to)) return female(t.name)?'Жена':'Муж';
  if(from.rel.sibs.includes(to)) return female(t.name)?'Сестра':'Брат';
  return 'Родня';
}
/* по стрелкам ходим только к тем, у кого есть карточка */
function neighbours(p){
  return [...new Set([...p.rel.parents,...p.rel.children,...p.rel.spouse,...p.rel.sibs])]
    .filter(id=>byId[id]&&byId[id].card!==false&&!isHidden(byId[id]));
}

/* ---------- границы неба ---------- */
const PAD=430;   // запас под цветные области ветвей и их подписи
const B={minX:-200,minY:-200,maxX:200,maxY:200};
const vb={x:0,y:0,w:0,h:0};

function measure(){
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  PEOPLE.forEach(p=>{a=Math.min(a,p.x);c=Math.max(c,p.x);b=Math.min(b,p.y);d=Math.max(d,p.y);});
  PETS.forEach(p=>{if(Number.isFinite(p.x)&&Number.isFinite(p.y)){a=Math.min(a,p.x);c=Math.max(c,p.x);b=Math.min(b,p.y);d=Math.max(d,p.y);}});
  if(!PEOPLE.length){a=b=-200;c=d=200;}

/* =====================================================================
   ВЕТВИ СЕМЬИ: цветная область за людьми одной ветви + подпись
   ===================================================================== */
function hull(pts){                                   // выпуклая оболочка
  const P=pts.slice().sort((a,b)=>a.x-b.x||a.y-b.y);
  const cr=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
  const lo=[],up=[];
  for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
  for(let i=P.length-1;i>=0;i--){const p=P[i];
    while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);}
  lo.pop();up.pop();
  return lo.concat(up);
}
function blob(pts,pad){                               // раздуть от центра и сгладить
  const c={x:pts.reduce((s,p)=>s+p.x,0)/pts.length, y:pts.reduce((s,p)=>s+p.y,0)/pts.length};
  const h=hull(pts).map(p=>{
    const dx=p.x-c.x,dy=p.y-c.y,L=Math.hypot(dx,dy)||1;
    return {x:p.x+dx/L*pad, y:p.y+dy/L*pad};
  });
  if(h.length<3) return '';
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  let m=mid(h[h.length-1],h[0]), d=`M${m.x.toFixed(1)} ${m.y.toFixed(1)}`;
  for(let i=0;i<h.length;i++){
    const p=h[i], n=mid(p,h[(i+1)%h.length]);
    d+=` Q${p.x.toFixed(1)} ${p.y.toFixed(1)} ${n.x.toFixed(1)} ${n.y.toFixed(1)}`;
  }
  return d+'Z';
}
/* скрытые и подсвеченная ветви */
const hiddenBr=new Set();
let focusBr=null;
const memberOf=id=>PEOPLE.filter(p=>p.branch===id);
const isHidden=p=>!!p.branch&&hiddenBr.has(p.branch);

function drawRegions(){
  let s='';
  BRANCHES.forEach(br=>{
    const mem=memberOf(br.id); if(!mem.length)return;
    const hid=hiddenBr.has(br.id);
    const dim=focusBr&&focusBr!==br.id;
    const pts=[];
    mem.forEach(p=>[[-80,-80],[80,-80],[80,110],[-80,110]].forEach(o=>pts.push({x:p.x+o[0],y:p.y+o[1]})));
    const d=blob(pts,110); if(!d)return;
    const cx=mem.reduce((a,p)=>a+p.x,0)/mem.length;
    const top=Math.min(...mem.map(p=>p.y));
    const k=hid?.08:(dim?.25:(focusBr===br.id?1.6:1));
    s+=`<path class="fill" d="${d}" fill="${br.color}" stroke="${br.color}" fill-opacity="${(.13*k).toFixed(3)}"/>
        <path class="edge" d="${d}" stroke="${br.color}" stroke-opacity="${(.40*k).toFixed(3)}"/>
        <text x="${cx.toFixed(0)}" y="${(top-250).toFixed(0)}" fill="${br.color}"
              opacity="${(hid?.12:(dim?.2:1))}">${br.title}</text>`;
  });
  regSvg.innerHTML=s;
  renderLegend();
}

/* ---------- панель ветвей: скрытие и подсветка ---------- */
function renderLegend(){

      <i style="background:${br.color}"></i><b>${br.title}</b><em>${n}</em>
      <button class="bact hide" data-act="hide" title="${off?'Показать':'Скрыть'} ветвь">${off?'◉':'👁'}</button>
      <button class="bact foc" data-act="foc" title="Приблизить и подсветить">◎</button>
    </span>`;
  }).join('')||'<span class="bitem">ветвей нет</span>';
  /* мобильное меню ветвей */
  const mob=document.getElementById('branchmob'); if(!mob)return;
  mob.innerHTML=BRANCHES.map(br=>{

      <button class="bact hide${off?' on':''}" data-act="hide" data-b="${br.id}">${off?'Показать':'Скрыть'}</button>
      <button class="bact foc" data-act="foc" data-b="${br.id}">Выделить</button>
    </div>`;
  }).join('')||'<div class="hint">ветвей нет</div>';
  mob.querySelectorAll('.bact').forEach(b=>b.onclick=()=>{

  });

function fitBranch(id){
  const mem=memberOf(id); if(!mem.length)return;
  const pad=420;
  const x1=Math.min(...mem.map(p=>p.x))-pad, x2=Math.max(...mem.map(p=>p.x))+pad;
  const y1=Math.min(...mem.map(p=>p.y))-pad, y2=Math.max(...mem.map(p=>p.y))+pad;
  const r=vp.getBoundingClientRect();
  S.tk=Math.max(MINK,Math.min(MAXK,Math.min(r.width/(x2-x1), r.height/(y2-y1))));
  S.tx=-((x1+x2)/2)*S.tk; S.ty=-((y1+y2)/2)*S.tk;
  wake();
}
function toggleBranch(id){
  if(focusBr) focusBr=null;
  hiddenBr.has(id)?hiddenBr.delete(id):hiddenBr.add(id);
  rebuild(false);
}
function focusBranch(id){
  if(focusBr===id){focusBr=null;fit();}
  else{focusBr=id;hiddenBr.delete(id);fitBranch(id);}
  rebuild(false);
}

/* ---------- линии-созвездия: свободные, дальние, не строгие ---------- */
const TRIM=44;               // небольшой отступ от звезды
/* прямые линии созвездия — точка к точке, без провисания */
function link(p1,p2,cls){
  const dx=p2.x-p1.x, dy=p2.y-p1.y, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
  const a={x:p1.x+ux*TRIM,y:p1.y+uy*TRIM}, b={x:p2.x-ux*TRIM,y:p2.y-uy*TRIM};
  const d=`M${a.x.toFixed(1)} ${a.y.toFixed(1)} L${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
  return `<path class="glow" d="${d}"/><path class="${cls}" d="${d}"/>`;
}
function drawLinks(anim){
  let paths='';
  UNIONS.forEach(u=>{
    const A=byId[u.a]; if(!A)return;
    const aHid=isHidden(A);
    const Bp=byId[u.b]?byId[u.b]:null;
    const bHid=Bp?isHidden(Bp):false;
    if(Bp) paths+=link(A,Bp,'bond'+(aHid||bHid?' dim':''));           // союз
    const mid=Bp?{x:(A.x+Bp.x)/2,y:(A.y+Bp.y)/2+30}:{x:A.x,y:A.y+46}; // одинокий родитель — узел под ним
    if(u.children.length) paths+=`<circle cx="${mid.x.toFixed(1)}" cy="${mid.y.toFixed(1)}" r="2.6" fill="#cfc8ff" opacity="${aHid?.25:.85}"/>`;
    u.children.forEach(c=>{
      const C=byId[c]; if(!C)return;
      paths+=link(mid,C,'desc'+(aHid||isHidden(C)?' dim':''));         // к потомку — прямой луч
    });
  });
  PETS.forEach(p=>{
    const owner=byId[p.owner];
    if(!owner||!Number.isFinite(p.x)||!Number.isFinite(p.y)||isHidden(owner))return;
    paths+=link(owner,p,'petlink');
  });
  linksSvg.innerHTML=paths;
  if(anim)[...linksSvg.querySelectorAll('path')].forEach((p,i)=>{
    p.animate([{opacity:0},{opacity:1}],
      {duration:1800,delay:500+Math.floor(i/2)*130,easing:'ease-out',fill:'backwards'});
  });
}

/* ---------- звёзды-персоны ---------- */

      <div class="nm">${p.name}</div><div class="yr">${p.years||''}</div>
      ${!plain&&p.voices.length?'<div class="mic">♪</div>':''}

    if(anim) el.animate([{opacity:0},{opacity:1}],

  });
  PETS.forEach((p,i)=>{

    if(!owner||isHidden(owner)||!Number.isFinite(p.x)||!Number.isFinite(p.y))return;
    const el=document.createElement('div');

      <div class="petnm">${p.name}</div>${p.species?`<div class="petspecies">${p.species}</div>`:''}`;
    if(anim)el.animate([{opacity:0},{opacity:1}],
      {duration:700,delay:500+i*45,easing:'ease-out',fill:'backwards'});
    frag.appendChild(el);
    p.el=el;
  });
  world.appendChild(frag);
}
/* лёгкая перерисовка: только области и линии (при перетаскивании звезды) */

/* полная пересборка: модель → границы → линии → звёзды */

}

/* ---------- плавный pan / zoom (без промотирования слоёв → без «шакалов») ---------- */
const vp=document.getElementById('viewport');
const S={x:0,y:0,k:1,tx:0,ty:0,tk:1};
const MINK=.14,MAXK=2.2;
function fit(anim=true){
  const r=vp.getBoundingClientRect();
  const k=Math.min(r.width/(vb.w*.98),r.height/(vb.h*1.02),1.05);
  S.tk=Math.max(MINK,Math.min(MAXK,k));
  S.tx=-((B.minX+B.maxX)/2)*S.tk; S.ty=-((B.minY+B.maxY)/2)*S.tk;
  if(!anim){S.x=S.tx;S.y=S.ty;S.k=S.tk;world.style.transform=`translate3d(${S.x}px,${S.y}px,0) scale(${S.k})`;}
  else wake();
}
function zoomAt(sx,sy,f){
  const r=vp.getBoundingClientRect(),cx=r.width/2,cy=r.height/2;
  const nk=Math.max(MINK,Math.min(MAXK,S.tk*f));
  const px=(sx-cx-S.tx)/S.tk, py=(sy-cy-S.ty)/S.tk;
  S.tk=nk; S.tx=sx-cx-px*nk; S.ty=sy-cy-py*nk;
  wake();
}
function centerOn(p,k){
  S.tk=Math.max(MINK,Math.min(MAXK,k!=null?k:S.tk));
  S.tx=-p.x*S.tk; S.ty=-p.y*S.tk;
  wake();
}
function loop(){
  const e=.15, moving=Math.abs(S.tx-S.x)+Math.abs(S.ty-S.y)>.15||Math.abs(S.tk-S.k)>.0004;
  if(moving){
    S.x+=(S.tx-S.x)*e; S.y+=(S.ty-S.y)*e; S.k+=(S.tk-S.k)*e;
    world.style.transform=`translate3d(${S.x}px,${S.y}px,0) scale(${S.k})`;
    if(!loop.on) loop.on=true;
  }else if(!loop.settled){
    S.x=S.tx;S.y=S.ty;S.k=S.tk;
    world.style.transform=`translate3d(${S.x}px,${S.y}px,0) scale(${S.k})`;
    loop.settled=true;
  }
  if(moving) loop.settled=false;
  if(moving || !loop.settled){ requestAnimationFrame(loop); loop.on=true; }
  else loop.on=false;
}
function wake(){ if(!loop.on && loop.settled){ loop.settled=false; requestAnimationFrame(loop); } }
fit(false); loop();

let drag=null;
/* редактор (editor.js) может перехватывать эти события — window.EDIT */
const hook=(name,arg)=>!!(window.EDIT&&window.EDIT[name]&&window.EDIT[name](arg));

vp.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  e.preventDefault();          // чтобы при протяжке не выделялся текст карточек
  vp.setPointerCapture(e.pointerId);
  if(hook('pointerdown',e))return;            // редактор потащил звезду
  drag={sx:e.clientX,sy:e.clientY,ox:S.tx,oy:S.ty,moved:0,
    id:e.target.closest('.node')?.dataset.id,
    petId:e.target.closest('.petnode')?.dataset.pet};
  vp.classList.add('grabbing');
});
vp.addEventListener('pointermove',e=>{
  if(hook('pointermove',e))return;
  if(!drag||pinching)return;
  const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));
  S.tx=drag.ox+dx; S.ty=drag.oy+dy;
  wake();
});
vp.addEventListener('pointerup',e=>{
  vp.classList.remove('grabbing');
  if(hook('pointerup',e)){drag=null;return;}
  if(drag&&drag.moved<6&&drag.petId){
    if(!hook('pickPet',drag.petId)) openPet(drag.petId);
  }else if(drag&&drag.moved<6&&drag.id){
    if(!hook('pick',drag.id)) open(drag.id);  // в режиме правки клик открывает форму, а не карточку
  }
  drag=null;
});
vp.addEventListener('wheel',e=>{e.preventDefault();
  zoomAt(e.clientX,e.clientY,Math.pow(.9988,e.deltaY*(e.deltaMode?18:1)));},{passive:false});
document.getElementById('zoomui').addEventListener('click',e=>{
  const z=e.target.dataset.z; if(!z)return;
  const r=vp.getBoundingClientRect();
  if(z==='in')zoomAt(r.width/2,r.height/2,1.35);
  if(z==='out')zoomAt(r.width/2,r.height/2,1/1.35);
  if(z==='fit')fit();
});
let pinch=null,pinching=false;
vp.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pinch=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);pinching=true;}},{passive:true});
vp.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&pinch){const[a,b]=e.touches,d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    zoomAt((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2,d/pinch);pinch=d;e.preventDefault();pinching=true;}},{passive:false});
vp.addEventListener('touchend',()=>{pinch=null;setTimeout(()=>{pinching=false},100);});
addEventListener('resize',()=>{fit();if(cur)placeCompass();wake();});

/* ---------- КАРТОЧКА: раскрывается ИЗ маленькой звезды ---------- */
const ov=document.getElementById('overlay'),sheet=document.getElementById('sheet'),
  bodyEl=sheet.querySelector('.body'),
      thumbs=sheet.querySelector('.gthumbs'),
      compass=document.getElementById('compass');
let cur=null,curPet=null,gi=0,home=null;

function activeCard(){return cur||curPet;}
function activePhotos(){
  const p=activeCard();
  if(!p)return [];
  return cur?realPhotos(p):(p.photos||[]).slice();
}
function petRect(p){
  const box=p.el.querySelector('.petph')||p.el;
  const r=box.getBoundingClientRect();
  return r.width?r:{left:innerWidth/2-30,top:innerHeight/2-30,width:60,height:60};
}

function nodeRect(p){
  const box=p.el.querySelector('.ph')||p.el.querySelector('.dot')||p.el;
  const r=box.getBoundingClientRect();
  return r.width?r:{left:innerWidth/2-40,top:innerHeight/2-40,width:80,height:80};
}
/* геометрия берётся из offsetWidth/Height, а не из getBoundingClientRect,
   иначе измерение попадает внутрь собственной анимации и всё «уезжает» */
function reveal(fromRect){
  const w=sheet.offsetWidth,h=sheet.offsetHeight;
  const bx=innerWidth/2-w/2, by=innerHeight/2-h/2;
  const nx=Math.round(fromRect.left+fromRect.width/2-bx);
  const ny=Math.round(fromRect.top+fromRect.height/2-by);
  const r0=Math.max(16,Math.round(fromRect.width/2));
  const R=Math.round(Math.hypot(Math.max(nx,w-nx),Math.max(ny,h-ny))*1.03);
  return {nx,ny,r0,R};
}
/* карточка РАСКРЫВАЕТСЯ из портрета звезды */
function grow(fromRect){
  if(MOBILE){ ov.classList.add('vis'); return; }   // на телефоне карточка во весь экран — просто плавное появление
  const {nx,ny,r0,R}=reveal(fromRect);
  sheet.style.clipPath=`circle(${R}px at ${nx}px ${ny}px)`;
  sheet.animate([
    {clipPath:`circle(${r0}px at ${nx}px ${ny}px)`,transform:'translate(-50%,-50%) scale(.955)',opacity:.35},
    {clipPath:`circle(${R}px at ${nx}px ${ny}px)`,transform:'translate(-50%,-50%) scale(1)',opacity:1}
  ],{duration:860,easing:'cubic-bezier(.19,.94,.14,1)'});
  bodyEl.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],
    {duration:700,delay:220,easing:'cubic-bezier(.2,.9,.15,1)',fill:'backwards'});
}
/* и СВОРАЧИВАЕТСЯ обратно в неё */
function shrink(toRect,done){
  if(MOBILE){ ov.classList.remove('open'); done(); return; }
  const {nx,ny,r0,R}=reveal(toRect);
  const a=sheet.animate([
    {clipPath:`circle(${R}px at ${nx}px ${ny}px)`,transform:'translate(-50%,-50%) scale(1)',opacity:1},
    {clipPath:`circle(${r0}px at ${nx}px ${ny}px)`,transform:'translate(-50%,-50%) scale(.96)',opacity:.2}
  ],{duration:560,easing:'cubic-bezier(.45,0,.25,1)'});
  a.onfinish=()=>{sheet.style.clipPath='';done();};
}

function open(id,fromCard=false){
  const p=byId[id]; if(!p)return;
  if(p.card===false||!p.el||isHidden(p))return;   // карточка отключена, ветвь скрыта либо нет узла
  const first=!cur&&!curPet;
  const r=nodeRect(p);
  cur=p; curPet=null; gi=0;
  document.querySelectorAll('.node.focus,.petnode.focus').forEach(n=>n.classList.remove('focus'));
  p.el.classList.add('focus');

  if(first){
    home={x:S.tx,y:S.ty,k:S.tk};
    centerOn(p,S.tk*0.9);                 // немного отдаляемся — заметно, но мягко
    vp.classList.add('dimmed');           // немного размываем
    document.querySelectorAll('.hud').forEach(h=>h.classList.add('hide'));
    ov.classList.add('open');   // сначала показываем контейнер, иначе размеры карточки = 0
    render();
    requestAnimationFrame(()=>{placeCompass();ov.classList.add('vis');grow(r);});
  }else{
    centerOn(p);
    sheet.classList.add('swap');
    setTimeout(()=>{render();placeCompass();bodyEl.scrollTop=0;thumbs.scrollLeft=0;sheet.classList.remove('swap');},230);
  }
}
function openPet(id,fromCard=false){
  const p=petById[id]; if(!p||!p.el)return;
  const first=!cur&&!curPet;
  const r=petRect(p);
  cur=null; curPet=p; gi=0;
  document.querySelectorAll('.node.focus,.petnode.focus').forEach(n=>n.classList.remove('focus'));
  p.el.classList.add('focus');
  compass.innerHTML='';
  if(first){
    home={x:S.tx,y:S.ty,k:S.tk};
    centerOn(p,S.tk*.9);
    vp.classList.add('dimmed');
    document.querySelectorAll('.hud').forEach(h=>h.classList.add('hide'));
    ov.classList.add('open');
    renderPet();
    requestAnimationFrame(()=>{ov.classList.add('vis');grow(r);});
  }else{
    centerOn(p);
    sheet.classList.add('swap');
    setTimeout(()=>{renderPet();bodyEl.scrollTop=0;thumbs.scrollLeft=0;sheet.classList.remove('swap');},230);
  }
}
function close(){
  const r=cur?nodeRect(cur):curPet?petRect(curPet):null;
  ov.classList.remove('vis');
  if(r) shrink(r,()=>ov.classList.remove('open')); else ov.classList.remove('open');
  vp.classList.remove('dimmed');
  document.querySelectorAll('.hud').forEach(h=>h.classList.remove('hide'));
  document.querySelectorAll('.node.focus,.petnode.focus').forEach(n=>n.classList.remove('focus'));
  if(home){S.tx=home.x;S.ty=home.y;S.tk=home.k;home=null;}
  cur=null; curPet=null; stopAllVoices();
}

/* ---------- 8 направлений движения по древу ---------- */
const R2=Math.SQRT1_2;
const SECTORS=[
  {k:'N', ux:0,  uy:-1, sx:0, sy:-1, g:'↑'},{k:'NE',ux:R2,uy:-R2,sx:1,sy:-1,g:'↗'},
  {k:'E', ux:1,  uy:0,  sx:1, sy:0,  g:'→'},{k:'SE',ux:R2,uy:R2, sx:1,sy:1, g:'↘'},
  {k:'S', ux:0,  uy:1,  sx:0, sy:1,  g:'↓'},{k:'SW',ux:-R2,uy:R2,sx:-1,sy:1,g:'↙'},
  {k:'W', ux:-1, uy:0,  sx:-1,sy:0,  g:'←'},{k:'NW',ux:-R2,uy:-R2,sx:-1,sy:-1,g:'↖'},
];
function directions(p){
  const out={};
  neighbours(p).forEach(id=>{
    const q=byId[id], dx=q.x-p.x, dy=q.y-p.y, L=Math.hypot(dx,dy)||1;
    let best=null,bs=-2;
    SECTORS.forEach(s=>{
      const dot=(dx/L)*s.ux+(dy/L)*s.uy;
      if(dot>bs){bs=dot;best=s;}
    });
    if(bs<.30) return;                       // слишком «между» — не показываем
    const prev=out[best.k];
    if(!prev||L<prev.L) out[best.k]={id,L,score:bs};
  });
  return out;
}
function placeCompass(){
  const dirs=directions(cur);
  const w=sheet.offsetWidth, h=sheet.offsetHeight;
  const cx=innerWidth/2, cy=innerHeight/2;
  /* все 8 кнопок лежат строго на одном контуре — прямоугольнике карточки,
     раздутом на GAP: луч направления пересекается с этим контуром */
  const GAP=34, HW=w/2+GAP, HH=h/2+GAP, E=1e-6;
  compass.innerHTML='';
  Object.entries(dirs).forEach(([k,v])=>{
    const s=SECTORS.find(s=>s.k===k), q=byId[v.id];
    const t=Math.min(HW/Math.max(Math.abs(s.ux),E), HH/Math.max(Math.abs(s.uy),E));
    let x=Math.round(Math.max(36,Math.min(innerWidth-36,cx+s.ux*t)));
    let y=Math.round(Math.max(36,Math.min(innerHeight-48,cy+s.uy*t)));
    const b=document.createElement('div');
    b.className='dnav'; b.style.left=x+'px'; b.style.top=y+'px';
    b.title=q.name;
    b.innerHTML=`${s.g}<span class="tip">${relLabel(cur,v.id)} · ${q.name.split(' ')[0]}</span>`;
    b.onclick=()=>open(v.id,true);
    compass.appendChild(b);
  });
}
function stepDir(key){
  const dirs=directions(cur);
  const order={ArrowUp:['N','NE','NW'],ArrowDown:['S','SE','SW'],
               ArrowLeft:['W','NW','SW'],ArrowRight:['E','NE','SE']}[key]||[];
  for(const k of order){ if(dirs[k]){open(dirs[k].id,true);return;} }
}

/* ---------- ГЛОБАЛЬНАЯ ГАЛЕРЕЯ: все фото, фильтр по ветвям и людям ---------- */
const galOv=document.getElementById('galoverlay'),
      galSheet=document.getElementById('galsheet'),

      galFilters=galSheet.querySelector('.galfilters');
let galBranch=null, galPerson=null;
const realPhotos=p=>(p.autoPhotos?[]:(p.photos||[]).slice());

function galleryItems(){
  let out=[];
  PEOPLE.forEach(p=>{
    if(isHidden(p)||p.card===false)return;   // только те, у кого включена карточка
    const phs=realPhotos(p);
    phs.forEach((src,i)=>{
      out.push({person:p.id,name:p.name,branch:p.branch,src,idx:i,tag:(p.photoTags||[])[i]||''});
    });
  });
  PETS.forEach(p=>{
    const owner=byId[p.owner];
    if(!owner||owner.card===false||isHidden(owner))return;
    (p.autoPhotos?[]:(p.photos||[])).forEach((src,i)=>{
      out.push({person:p.id,name:'🐾 '+p.name,branch:owner.branch,src,idx:i,tag:(p.photoTags||[])[i]||''});

    `<option value="${p.id}" ${galPerson===p.id?'selected':''}>${p.name}</option>`).join('')+

/* ---------- ГОЛОС: настоящий плеер с перемоткой ---------- */
const fmt=t=>(!isFinite(t)||t<0)?'0:00':Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
function voiceHTML(v,i){
  const has=!!(v.url&&String(v.url).trim());
  return `<div class="voice ${has?'':'off'}" data-vi="${i}">
    <button class="pp" data-play="${i}" ${has?'':'disabled'} title="${has?'Слушать':'Файл не указан'}">▶</button>
    <div class="info">
      <div class="ttl">${v.title||'Запись'}</div>
      <div class="bar" data-seek="${i}"><i></i></div>
      ${has?'':'<div class="err">не указан путь к аудиофайлу</div>'}
    </div>
    <div class="tm"><b>0:00</b> / <em>${v.dur||'—'}</em></div></div>`;
}
let A=null, aBox=null;                       // текущий Audio и его строка
function vUI(){
  if(!aBox)return;
  const btn=aBox.querySelector('.pp');
  const playing=A&&!A.paused&&!A.ended;
  btn.textContent=playing?'❚❚':'▶';
  aBox.classList.toggle('play',!!playing);
}
function stopAllVoices(){
  if(A){A.pause();A.src='';A=null;}
  if(aBox){aBox.classList.remove('play');
    const f=aBox.querySelector('.bar i'); if(f)f.style.width='0%';
    const b=aBox.querySelector('.pp'); if(b)b.textContent='▶';
    const t=aBox.querySelector('.tm b'); if(t)t.textContent='0:00';
    aBox=null;}
}
function playVoice(i){
  const v=cur.voices[i], box=bodyEl.querySelector(`.voice[data-vi="${i}"]`);
  if(!v||!v.url||!box)return;
  if(aBox===box&&A){ A.paused?A.play().catch(()=>{}):A.pause(); vUI(); return; }
  stopAllVoices();
  aBox=box; A=new Audio(v.url); A.preload='metadata';
  const fill=box.querySelector('.bar i'), now=box.querySelector('.tm b'), tot=box.querySelector('.tm em');
  A.addEventListener('loadedmetadata',()=>{if(isFinite(A.duration))tot.textContent=fmt(A.duration);});
  A.addEventListener('timeupdate',()=>{
    if(A.duration) fill.style.width=(A.currentTime/A.duration*100).toFixed(2)+'%';
    now.textContent=fmt(A.currentTime);
  });
  A.addEventListener('play',vUI); A.addEventListener('pause',vUI);
  A.addEventListener('ended',()=>{fill.style.width='0%';now.textContent='0:00';vUI();});
  A.addEventListener('error',()=>{
    box.classList.add('off');
    if(!box.querySelector('.err')){
      const e=document.createElement('div'); e.className='err';
      e.textContent='файл не открылся: '+v.url; box.querySelector('.info').appendChild(e);
    }
    stopAllVoices();
  });
  A.play().catch(()=>{});
  vUI();
}
bodyEl.addEventListener('click',e=>{
  const btn=e.target.closest('[data-play]');
  if(btn&&!btn.disabled) playVoice(+btn.dataset.play);
});
/* перемотка: клик и протягивание по полосе */
let seeking=null;
function seekTo(bar,clientX){
  const i=+bar.dataset.seek;
  if(!A||aBox!==bar.closest('.voice')) playVoice(i);
  if(!A||!A.duration)return;
  const r=bar.getBoundingClientRect();
  const k=Math.min(1,Math.max(0,(clientX-r.left)/r.width));
  A.currentTime=k*A.duration;
  bar.querySelector('i').style.width=(k*100).toFixed(2)+'%';
}
bodyEl.addEventListener('pointerdown',e=>{
  const bar=e.target.closest('.bar[data-seek]'); if(!bar)return;
  const row=bar.closest('.voice'); if(row.classList.contains('off')&&!A)return;
  seeking=bar; bar.setPointerCapture(e.pointerId); seekTo(bar,e.clientX);
});
bodyEl.addEventListener('pointermove',e=>{if(seeking)seekTo(seeking,e.clientX);});
addEventListener('pointerup',()=>{seeking=null;});

/* ---------- клавиатура ---------- */
addEventListener('keydown',e=>{
  if(lbg.classList.contains('open')){
    if(e.key==='Escape')lbGalClose();
    if(e.key==='ArrowLeft')lbGalStep(-1);
    if(e.key==='ArrowRight')lbGalStep(1);
    return;
  }
  if(lb.classList.contains('open')){
    if(e.key==='Escape')lbClose();
    if(e.key==='ArrowLeft'){setPhoto(gi-1);lbSync();}
    if(e.key==='ArrowRight'){setPhoto(gi+1);lbSync();}
    return;
  }
  if(cur){
    if(e.key==='Escape')close();
    if(e.key.startsWith('Arrow')){e.preventDefault();stepDir(e.key);}
  }else{
    if(e.key==='+'||e.key==='=')zoomAt(innerWidth/2,innerHeight/2,1.3);
    if(e.key==='-')zoomAt(innerWidth/2,innerHeight/2,1/1.3);
    if(e.key==='0')fit();
  }
});

/* ---------- дальний звёздный фон ----------
   Раньше каждый кадр перерисовывались все звёзды (сотни arc() в секунду) —
   это и был главный источник тормозов. Теперь неподвижные звёзды рисуются
   ОДИН раз в отдельный слой, а мерцают только несколько десятков, и то
   не чаще 20 кадров в секунду.                                           */
(function deepSky(){
  const cv=document.querySelector('#deep canvas'); if(!cv)return;
  const ctx=cv.getContext('2d',{alpha:true});
  const base=document.createElement('canvas'), bctx=base.getContext('2d');
  const COL=['214,220,255','176,196,255','196,168,255','235,230,255'];
  let W,H,dpr,twink=[];
  function init(){
    dpr=Math.min(devicePixelRatio||1, MOBILE?1.5:2);
    W=cv.width=base.width=Math.round(innerWidth*dpr);
    H=cv.height=base.height=Math.round(innerHeight*dpr);
    const total=Math.round(innerWidth*innerHeight/(MOBILE?11000:6500));
    bctx.clearRect(0,0,W,H);
    for(let i=0;i<total;i++){
      const r=(Math.random()*1.2+.25)*dpr;
      bctx.beginPath(); bctx.arc(Math.random()*W,Math.random()*H,r,0,6.283);
      bctx.fillStyle=`rgba(${COL[i&3]},${(Math.random()*.5+.1).toFixed(2)})`; bctx.fill();
    }
    twink=Array.from({length:MOBILE?14:34},()=>({
      x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.4+.5)*dpr,
      a:Math.random()*.5+.2,ph:Math.random()*6.283,sp:Math.random()*.0012+.0005,
      c:COL[Math.floor(Math.random()*4)]}));
    paint(0);
  }
  function paint(t){
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(base,0,0);
    for(const s of twink){
      const a=s.a*(.45+.55*Math.sin(t*s.sp+s.ph));
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283);
      ctx.fillStyle=`rgba(${s.c},${a.toFixed(2)})`; ctx.fill();
    }
  }
  let last=0;
  (function frame(t){ if(t-last>50){last=t;paint(t);} requestAnimationFrame(frame); })(0);
  init();
  let rz=null;
  addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(init,250);});
})();
